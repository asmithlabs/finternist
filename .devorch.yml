# devorch per-repo config (read by the devorch orchestrator on the NAS).
# devorch workers may not edit this file; change it by PR.
language: ruby
# The repo starts as docs only, so every command tolerates "no Rails app yet".
setup: "if [ -f Gemfile ]; then bundle install && bin/rails db:prepare; fi"
# RSpec, per MASTER_SPEC section 2. The older docs/ARCHITECTURE.md says Minitest; the spec wins.
test: "if [ -f Gemfile ] && [ -d spec ]; then bundle exec rspec; else echo 'no Rails app yet'; exit 1; fi"
lint: "if [ -f Gemfile ]; then bundle exec rubocop --format json; else echo '{\"files\":[]}'; fi"
dependency_audit: "if [ -f Gemfile.lock ]; then bundle exec bundler-audit check --update; else true; fi"
test_db_url: "postgres://devorch:devorch-test-only@devorch-testdb/finternist_test"
# The master spec and the agent guide come first: they decide everything else.
context_files: [CLAUDE.md, docs/MASTER_SPEC.md, README.md, docs/ARCHITECTURE.md, docs/MVP_SCOPE.md, docs/BUILD_BACKLOG.md]
# Only the founder-owned documents are protected. docs/ as a whole must stay writable: MASTER_SPEC
# section 25 requires agents to create docs/product, docs/architecture, docs/planning and the rest,
# which is most of Phase 0's deliverable.
protected_paths: [docs/MASTER_SPEC.md, CLAUDE.md]
