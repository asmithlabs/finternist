# devorch per-repo config (read by the devorch orchestrator on the NAS).
# devorch workers may not edit this file; change it by PR.
language: ruby
# Pre-Rails (F1-F4 are documentation only): no Rails, RSpec, database or asset commands run until
# F5 creates bin/rails. bundle install still runs once a Gemfile exists so F5 can bootstrap.
setup: |
  if [ -f Gemfile ]; then bundle install; fi
  if [ -x bin/rails ]; then
    bin/rails db:prepare
  else
    echo "Pre-Rails repository: skipping Rails setup"
  fi
# RSpec, per MASTER_SPEC section 2 (the superseded notes say Minitest; the spec wins).
#
# Documentation checks: every spec/docs/*_check.sh is a plain POSIX sh script that exits non-zero
# when a documentation acceptance criterion is not met (file exists, required section present...).
# They run before and after Rails exists. RSpec runs only once F5 has created bin/rails.
# Before Rails, at least one doc check must exist, so a feature cannot pass with nothing checked.
test: |
  set -e
  n=0
  for f in spec/docs/*_check.sh; do
    [ -e "$f" ] || continue
    n=$((n+1)); echo "== $f"; sh "$f"
  done
  if [ -x bin/rails ]; then
    bundle exec rspec
  elif [ "$n" -eq 0 ]; then
    echo "Pre-Rails repository: no spec/docs/*_check.sh documentation checks found"; exit 1
  else
    echo "Pre-Rails repository: $n documentation check(s) passed; skipping RSpec"
  fi
lint: "if [ -x bin/rails ]; then bundle exec rubocop --format json; else echo '{\"files\":[]}'; fi"
dependency_audit: "if [ -f Gemfile.lock ]; then bundle exec bundler-audit check --update; else true; fi"
test_db_url: "postgres://devorch:devorch-test-only@devorch-testdb/finternist_test"
# The master spec and the agent guide come first: they decide everything else. The pre-spec
# starter notes are deliberately NOT here - they contradict the spec on the test framework, the
# auth scope, the scoring framework and the phase ordering, and a planner that reads both has to
# guess. They are kept, bannered, under docs/superseded/.
context_files: [CLAUDE.md, docs/MASTER_SPEC.md, README.md]
# Only the founder-owned documents are protected. docs/ as a whole must stay writable: MASTER_SPEC
# section 25 requires agents to create docs/product, docs/architecture, docs/planning and the rest,
# which is most of Phase 0's deliverable.
protected_paths: [docs/MASTER_SPEC.md, CLAUDE.md]
